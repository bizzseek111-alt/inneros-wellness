version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: inneros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inneros
      POSTGRES_PASSWORD: inneros_dev_password
      POSTGRES_DB: inneros
    ports:
      - "5432:5432"
    volumes:
      - inneros_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inneros -d inneros"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    container_name: inneros-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://inneros:inneros_dev_password@postgres:5432/inneros
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    build:
      context: ./apps/web
    container_name: inneros-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  inneros_pgdata:
